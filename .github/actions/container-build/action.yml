name: container-build
description: Builds and pushes a Docker image
inputs:
  registry:
    required: true
    description: Container registry to push the image to
  registry-path:
    required: true
    description: Path to the image in the container registry
  registry-username:
    required: true
    description: Username to log in to the container registry
  registry-password:
    required: true
    description: Password to log in to the container registry
  push-image:
    required: true
    description: If true, pushes the image to the registry
  dockerfile:
    required: false
    default: Dockerfile
    description: Path to the Dockerfile to build (relative to the repo root)

outputs:
  digest:
    description: Digest (sha256:...) of the pushed image manifest, for pinning deploys by digest
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Set up Docker Build
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Log in to Container Registry
      uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ inputs.registry }}/${{ inputs.registry-path }}
        flavor: |
          latest=false
        tags: |
          type=raw,value={{branch}},enable=${{ github.ref_type == 'branch' && github.event_name != 'pull_request' }}
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix=
          type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0') && !startsWith(github.ref, 'refs/tags/0') }}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}.{{minor}}.{{patch}}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        cache-from: type=gha,scope=${{ inputs.registry-path }}
        cache-to: type=gha,mode=max,scope=${{ inputs.registry-path }}
        push: ${{ inputs.push-image }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
